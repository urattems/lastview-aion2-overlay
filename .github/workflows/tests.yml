# Tests à chaque push (cahier, section 11.1). Windows seulement : le cœur
# utilise les API Windows (table TCP, Npcap chargé à l'exécution).
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances du front
        run: npm ci

      - name: Tests du cœur (unitaires, non-régression, robustesse)
        run: cargo test -p lastview-core

      # Comme pour une Release : `tauri build` (front compris), jamais `cargo` seul.
      - name: Compilation de l'app (tauri build)
        run: npx tauri build --no-bundle

      # Le binaire doit embarquer les pages du front (incident du 12/11/2026 :
      # sans l'option custom-protocol, l'app cherchait localhost:1420).
      - name: Vérification des pages intégrées au binaire
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\lastview.exe -ArgumentList '--verifier-pages' -Wait -PassThru
          Get-Content target\release\verifier-pages.txt
          if ($p.ExitCode -ne 0) { throw "pages du front absentes du binaire (code $($p.ExitCode))" }
