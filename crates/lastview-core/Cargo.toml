[package]
name = "lastview-core"
description = "LastView : capture passive, décodage, mémoire silencieuse, rencontres, base locale et client API (sans interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "lastview_core"
path = "src/lib.rs"

[[bin]]
name = "lastview-dump"
path = "src/bin/lastview-dump.rs"

[dependencies]
libloading = "0.8"
lz4_flex = { version = "0.11", default-features = false, features = ["safe-decode", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
log = "0.4"
crossbeam-channel = "0.5"
percent-encoding = "2"
