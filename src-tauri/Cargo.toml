[package]
name = "lastview"
description = "LastView — Aion 2 Overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Pages du front intégrées au programme. Sans cette option (activée d'office),
# une compilation directe par `cargo` chercherait le serveur de développement
# (localhost:1420) et afficherait une page d'erreur.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
crossbeam-channel = "0.5"
ureq = { version = "2", default-features = false, features = ["tls"] }
percent-encoding = "2"
lastview-core = { path = "../crates/lastview-core" }
